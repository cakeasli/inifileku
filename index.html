<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Monitoring Budgeting – Kapal</title>
  <!-- TailwindCSS v3.4.6 -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.6/dist/tailwind.min.css" rel="stylesheet">
  <!-- Simple-DataTables -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" />
  <style>
    /* Scrollbar for sidebar */
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background:#6b7280; border-radius:3px; }
    /* Offcanvas right sidebar */
    #detailSidebar { transition: transform 0.3s ease; transform: translateX(100%); }
    #detailSidebar.open { transform: translateX(0); }
  </style>
</head>
<body class="font-inter bg-gray-100 text-gray-800">
  <div class="flex min-h-screen">
    <!-- Left Sidebar -->
    <aside id="leftSidebar" class="sidebar fixed inset-y-0 left-0 w-72 bg-gray-900 text-gray-100 hidden md:flex flex-col z-30">
      <div class="flex items-center gap-2 px-6 py-5 text-xl font-semibold">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7l6 6-6 6M21 7l-6 6 6 6" /></svg>
        <span>KapalDash</span>
      </div>
      <nav class="flex-1 px-4 space-y-1">
        <!-- Navigation Items -->
        <a href="#" class="group flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400 group-hover:text-blue-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /></svg>
          <span>Dashboard</span>
        </a>
        <a href="#" class="group flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400 group-hover:text-blue-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h18v6H3zM3 15h18v6H3z" /></svg>
          <span>Pengiriman</span>
        </a>
        <a href="#" class="group flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400 group-hover:text-blue-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.104 0-2 .672-2 1.5S10.896 11 12 11s2-.672 2-1.5S13.104 8 12 8z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12v7h12v-7" /></svg>
          <span>Anggaran</span>
        </a>
        <a href="#" class="group flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400 group-hover:text-blue-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h16v12H4zM4 20h16" /></svg>
          <span>Laporan</span>
        </a>
        <a href="#" class="group flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400 group-hover:text-blue-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.4 15A8 8 0 116.6 9" /></svg>
          <span>Pengaturan</span>
        </a>
      </nav>
      <!-- User Info -->
      <div class="px-6 py-4 border-t border-gray-800 flex items-center gap-3">
        <img src="https://ui-avatars.com/api/?name=Admin+Kapal" class="h-10 w-10 rounded-full" alt="avatar" />
        <div>
          <p class="text-sm font-medium">Admin Kapal</p>
          <button class="text-xs text-gray-400 hover:text-gray-200">Logout</button>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col md:ml-72">
      <!-- Header -->
      <header class="sticky top-0 z-20 bg-white shadow-sm flex items-center justify-between px-4 md:px-6 py-3">
        <h1 class="text-xl font-semibold">Dashboard Budgeting Kapal</h1>
        <div class="flex items-center gap-4">
          <input type="text" placeholder="Cari..." class="hidden md:block border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring focus:border-blue-400" />
          <img src="https://ui-avatars.com/api/?name=Admin+Kapal" class="h-8 w-8 rounded-full" alt="avatar" />
        </div>
      </header>

      <!-- Content -->
      <main class="p-4 md:p-6 space-y-6">
        <!-- Stat Cards Row -->
        <div id="statCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- Charts Row -->
        <div class="grid lg:grid-cols-2 gap-6">
          <div class="bg-white rounded-xl shadow-lg p-4">
            <h2 class="font-semibold mb-4">Breakdown Anggaran per Kategori</h2>
            <div class="relative h-64">
              <canvas id="donutChart"></canvas>
            </div>
          </div>
          <!-- Progress Cards -->
          <div id="progressCards" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>

        <!-- List & Table Row -->
        <div class="grid xl:grid-cols-2 gap-6">
          <!-- Ship Progress List -->
          <div class="bg-white rounded-xl shadow-lg">
            <div class="flex items-center justify-between p-4 border-b">
              <h2 class="font-semibold">Progress Kapal</h2>
              <div class="flex gap-1" id="shipTabs"></div>
            </div>
            <div class="p-4 overflow-y-auto max-h-[420px]" id="shipListContainer"></div>
          </div>

          <!-- History Table -->
          <div class="bg-white rounded-xl shadow-lg p-4">
            <h2 class="font-semibold mb-4">History Pengiriman</h2>
            <div class="overflow-x-auto">
              <table id="historyTable" class="min-w-full text-sm"></table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Right Detail Sidebar -->
    <aside id="detailSidebar" class="fixed top-0 right-0 w-96 h-full bg-white shadow-lg z-40 flex flex-col">
      <div class="flex items-center justify-between px-4 py-3 border-b">
        <h2 id="sidebarTitle" class="font-semibold">Detail Kategori</h2>
        <button id="closeSidebar" class="text-gray-500 hover:text-gray-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4" id="sidebarContent"></div>
      <div class="p-4 border-t flex justify-end gap-2">
        <button class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">Export</button>
        <button class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300" id="closeSidebarBottom">Tutup</button>
      </div>
    </aside>
  </div>

  <!-- Chart.js v4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Simple-DataTables -->
  <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" ></script>
  <script>
    // Dummy Data (would normally come from APIs)
    const summaryData = { total_budget: 2500000000, remaining_budget: 650000000, over_budget: 120000000, off_budget: 50000000 };
    const categoriesData = [
      { key: 'kapal_kecil', label: 'Kapal Kecil', amount: 600000000, color: '#60a5fa' },
      { key: 'kapal_medium', label: 'Kapal Medium', amount: 900000000, color: '#34d399' },
      { key: 'kapal_besar', label: 'Kapal Besar', amount: 1000000000, color: '#f97316' },
    ];
    const categoriesProgress = [
      { category_key: 'kapal_kecil', category_label: 'Kapal Kecil', total_budget: 600000000, used_budget: 280000000, used_percent: 46, color: '#60a5fa' },
      { category_key: 'kapal_medium', category_label: 'Kapal Medium', total_budget: 900000000, used_budget: 540000000, used_percent: 60, color: '#34d399' },
      { category_key: 'kapal_besar', category_label: 'Kapal Besar', total_budget: 1000000000, used_budget: 830000000, used_percent: 83, color: '#f97316' },
    ];
    const shipsProgressData = {
      kapal_kecil: [
        { id: 'KK-001', ship_name: 'Kapal Kecil A', budget_allocated: 60000000, budget_used: 30000000, progress_percent: 50, delivery_status: 'In Transit' },
        { id: 'KK-002', ship_name: 'Kapal Kecil B', budget_allocated: 60000000, budget_used: 42000000, progress_percent: 70, delivery_status: 'Delivered' },
        { id: 'KK-003', ship_name: 'Kapal Kecil C', budget_allocated: 60000000, budget_used: 18000000, progress_percent: 30, delivery_status: 'Pending' },
        { id: 'KK-004', ship_name: 'Kapal Kecil D', budget_allocated: 60000000, budget_used: 36000000, progress_percent: 60, delivery_status: 'In Transit' },
        { id: 'KK-005', ship_name: 'Kapal Kecil E', budget_allocated: 60000000, budget_used: 6000000, progress_percent: 10, delivery_status: 'Pending' },
        { id: 'KK-006', ship_name: 'Kapal Kecil F', budget_allocated: 60000000, budget_used: 48000000, progress_percent: 80, delivery_status: 'Delivered' },
        { id: 'KK-007', ship_name: 'Kapal Kecil G', budget_allocated: 60000000, budget_used: 15000000, progress_percent: 25, delivery_status: 'In Transit' },
        { id: 'KK-008', ship_name: 'Kapal Kecil H', budget_allocated: 60000000, budget_used: 30000000, progress_percent: 50, delivery_status: 'Delivered' },
        { id: 'KK-009', ship_name: 'Kapal Kecil I', budget_allocated: 60000000, budget_used: 42000000, progress_percent: 70, delivery_status: 'In Transit' },
        { id: 'KK-010', ship_name: 'Kapal Kecil J', budget_allocated: 60000000, budget_used: 54000000, progress_percent: 90, delivery_status: 'Delivered' },
      ],
      kapal_medium: [
        { id: 'KM-001', ship_name: 'Kapal Medium A', budget_allocated: 180000000, budget_used: 90000000, progress_percent: 50, delivery_status: 'In Transit' },
        { id: 'KM-002', ship_name: 'Kapal Medium B', budget_allocated: 180000000, budget_used: 120000000, progress_percent: 67, delivery_status: 'Delivered' },
        { id: 'KM-003', ship_name: 'Kapal Medium C', budget_allocated: 180000000, budget_used: 54000000, progress_percent: 30, delivery_status: 'Pending' },
        { id: 'KM-004', ship_name: 'Kapal Medium D', budget_allocated: 180000000, budget_used: 162000000, progress_percent: 90, delivery_status: 'Delivered' },
        { id: 'KM-005', ship_name: 'Kapal Medium E', budget_allocated: 180000000, budget_used: 36000000, progress_percent: 20, delivery_status: 'In Transit' },
      ],
      kapal_besar: [
        { id: 'KB-001', ship_name: 'Kapal Besar A', budget_allocated: 166666667, budget_used: 100000000, progress_percent: 60, delivery_status: 'In Transit' },
        { id: 'KB-002', ship_name: 'Kapal Besar B', budget_allocated: 166666667, budget_used: 150000000, progress_percent: 90, delivery_status: 'Delivered' },
        { id: 'KB-003', ship_name: 'Kapal Besar C', budget_allocated: 166666667, budget_used: 80000000, progress_percent: 48, delivery_status: 'Pending' },
        { id: 'KB-004', ship_name: 'Kapal Besar D', budget_allocated: 166666667, budget_used: 166666667, progress_percent: 100, delivery_status: 'Delivered' },
        { id: 'KB-005', ship_name: 'Kapal Besar E', budget_allocated: 166666667, budget_used: 90000000, progress_percent: 54, delivery_status: 'In Transit' },
        { id: 'KB-006', ship_name: 'Kapal Besar F', budget_allocated: 166666667, budget_used: 40000000, progress_percent: 24, delivery_status: 'Pending' },
      ],
    };
    const historyData = [
      { date: '2025-07-28', ship_id: 'KK-003', ship_name: 'Kapal Kecil C', item: 'BBM', amount: 1200000, status: 'Delivered', notes: '' },
      { date: '2025-07-26', ship_id: 'KM-002', ship_name: 'Kapal Medium B', item: 'Spare Part Mesin', amount: 25000000, status: 'Delivered', notes: 'Urgent' },
      { date: '2025-07-25', ship_id: 'KB-004', ship_name: 'Kapal Besar D', item: 'Kargo A', amount: 7800000, status: 'In Transit', notes: 'Delay 1 hari' },
      { date: '2025-07-22', ship_id: 'KK-010', ship_name: 'Kapal Kecil J', item: 'Perlengkapan Deck', amount: 450000, status: 'Delivered', notes: '' },
      { date: '2025-07-20', ship_id: 'KB-002', ship_name: 'Kapal Besar B', item: 'Container X', amount: 90000000, status: 'Delivered', notes: 'High priority' },
    ];

    const idr = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' });

    /* ---------- Render Stat Cards ---------- */
    const statCardsContainer = document.getElementById('statCards');
    const stats = [
      { key: 'total_budget', label: 'Total Anggaran', icon: 'wallet', gradient: 'from-blue-500 to-blue-400' },
      { key: 'remaining_budget', label: 'Sisa Anggaran', icon: 'save', gradient: 'from-green-500 to-green-400' },
      { key: 'over_budget', label: 'Over Budget', icon: 'trending-up', gradient: 'from-red-500 to-red-400' },
      { key: 'off_budget', label: 'Off Budget', icon: 'slash', gradient: 'from-yellow-500 to-yellow-400' },
    ];
    stats.forEach(s => {
      const card = document.createElement('div');
      card.className = `rounded-xl shadow-lg p-5 bg-gradient-to-br ${s.gradient} text-white flex items-center gap-4`;
      card.innerHTML = `
        <div class="flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <use href="#${s.icon}" />
          </svg>
        </div>
        <div>
          <p class="text-sm opacity-80">${s.label}</p>
          <p class="text-lg font-semibold">${idr.format(summaryData[s.key])}</p>
        </div>
      `;
      statCardsContainer.appendChild(card);
    });

    /* ---------- Donut Chart ---------- */
    const ctxDonut = document.getElementById('donutChart');
    const donutChart = new Chart(ctxDonut, {
      type: 'doughnut',
      data: {
        labels: categoriesData.map(c => c.label),
        datasets: [{
          label: 'Anggaran per Kategori',
          data: categoriesData.map(c => c.amount),
          backgroundColor: categoriesData.map(c => c.color),
          hoverOffset: 8,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom' },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: ${idr.format(ctx.raw)}` } }
        },
        onClick: (e, elements) => {
          if (elements.length) {
            const index = elements[0].index;
            openDetailSidebar(categoriesData[index]);
          }
        }
      }
    });

    /* ---------- Progress Cards ---------- */
    const progressCardsContainer = document.getElementById('progressCards');
    categoriesProgress.forEach((cat, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'bg-white rounded-xl shadow flex flex-col items-center p-4 cursor-pointer';
      wrapper.innerHTML = `
        <canvas id="miniChart-${i}" class="h-28 w-28"></canvas>
        <p class="mt-3 font-medium">${cat.category_label}</p>
        <p class="text-sm text-gray-500">${idr.format(cat.used_budget)} / ${idr.format(cat.total_budget)}</p>
      `;
      wrapper.addEventListener('click', () => switchShipList(cat.category_key));
      progressCardsContainer.appendChild(wrapper);
      // mini chart
      new Chart(wrapper.querySelector('canvas'), {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [cat.used_percent, 100 - cat.used_percent],
            backgroundColor: [cat.color, '#e5e7eb'],
            borderWidth: 0,
            cutout: '70%'
          }]
        },
        options: { plugins: { legend: { display: false } }, rotation: -90, circumference: 360, maintainAspectRatio: false }
      });
    });

    /* ---------- Ship Tabs & List ---------- */
    const shipTabsContainer = document.getElementById('shipTabs');
    const shipListContainer = document.getElementById('shipListContainer');
    ['kapal_kecil', 'kapal_medium', 'kapal_besar'].forEach((key, idx) => {
      const tabBtn = document.createElement('button');
      tabBtn.className = `px-3 py-1.5 rounded-md text-sm ${idx === 0 ? 'bg-blue-500 text-white' : 'text-gray-600 hover:bg-gray-100'}`;
      tabBtn.textContent = categoriesData.find(c => c.key === key).label;
      tabBtn.addEventListener('click', () => switchShipList(key));
      shipTabsContainer.appendChild(tabBtn);
    });

    function renderShipList(key) {
      shipListContainer.innerHTML = '';
      shipsProgressData[key].forEach(ship => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between py-2 border-b last:border-none text-sm';
        row.innerHTML = `
          <div>
            <p class="font-medium">${ship.ship_name}</p>
            <p class="text-xs text-gray-500">${ship.id}</p>
          </div>
          <div class="flex-1 mx-4">
            <div class="w-full bg-gray-200 rounded-full h-2"><div class="h-2 rounded-full" style="width:${ship.progress_percent}%; background-color:${getCategoryColor(key)}"></div></div>
          </div>
          <div class="text-right">
            <p>${idr.format(ship.budget_used)}</p>
            <p class="text-xs text-gray-500">${ship.progress_percent}%</p>
          </div>
        `;
        shipListContainer.appendChild(row);
      });
    }
    function getCategoryColor(key) { return categoriesData.find(c => c.key === key).color; }

    function switchShipList(key) {
      // update tab styles
      [...shipTabsContainer.children].forEach(btn => btn.className = 'px-3 py-1.5 rounded-md text-sm text-gray-600 hover:bg-gray-100');
      const activeBtn = [...shipTabsContainer.children].find(btn => btn.textContent === categoriesData.find(c => c.key === key).label);
      if (activeBtn) activeBtn.className = 'px-3 py-1.5 rounded-md text-sm bg-blue-500 text-white';
      renderShipList(key);
      // scroll into view on small screens
      shipListContainer.parentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // init default list
    switchShipList('kapal_kecil');

    /* ---------- History Table ---------- */
    const historyTable = document.getElementById('historyTable');
    // build table header & body
    historyTable.innerHTML = `
      <thead>
        <tr class="bg-gray-50 text-left">
          <th class="px-2 py-2">Tanggal</th>
          <th class="px-2 py-2">Ship ID</th>
          <th class="px-2 py-2">Nama Kapal</th>
          <th class="px-2 py-2">Barang</th>
          <th class="px-2 py-2">Jumlah Terpakai (IDR)</th>
          <th class="px-2 py-2">Status</th>
          <th class="px-2 py-2">Catatan</th>
        </tr>
      </thead>
      <tbody>
        ${historyData.map(r => `
          <tr>
            <td class="px-2 py-1">${r.date}</td>
            <td class="px-2 py-1">${r.ship_id}</td>
            <td class="px-2 py-1">${r.ship_name}</td>
            <td class="px-2 py-1">${r.item}</td>
            <td class="px-2 py-1">${idr.format(r.amount)}</td>
            <td class="px-2 py-1">${r.status}</td>
            <td class="px-2 py-1">${r.notes}</td>
          </tr>
        `).join('')}
      </tbody>
    `;
    new simpleDatatables.DataTable(historyTable, { perPage: 10, perPageSelect: [10, 25, 50], searchable: true, labels: { placeholder: 'Cari...', perPage: '{select} baris per halaman', noRows: 'Tidak ada data', info: 'Menampilkan {start}–{end} dari {rows} data' } });

    /* ---------- Detail Sidebar ---------- */
    const detailSidebar = document.getElementById('detailSidebar');
    const sidebarTitle = document.getElementById('sidebarTitle');
    const sidebarContent = document.getElementById('sidebarContent');
    document.getElementById('closeSidebar').addEventListener('click', () => detailSidebar.classList.remove('open'));
    document.getElementById('closeSidebarBottom').addEventListener('click', () => detailSidebar.classList.remove('open'));

    function openDetailSidebar(category) {
      sidebarTitle.textContent = `Detail ${category.label}`;
      // simulate fetch detail
      const detailData = {
        kapal_besar: {
          sub_items: [
            { ship_id: 'KB-001', ship_name: 'Kapal Besar A', allocated: 166666667, used: 100000000 },
            { ship_id: 'KB-002', ship_name: 'Kapal Besar B', allocated: 166666667, used: 150000000 },
            { ship_id: 'KB-003', ship_name: 'Kapal Besar C', allocated: 166666667, used: 80000000 },
          ]
        },
        kapal_medium: {
          sub_items: [
            { ship_id: 'KM-001', ship_name: 'Kapal Medium A', allocated: 180000000, used: 90000000 },
            { ship_id: 'KM-002', ship_name: 'Kapal Medium B', allocated: 180000000, used: 120000000 },
          ]
        },
        kapal_kecil: {
          sub_items: [
            { ship_id: 'KK-001', ship_name: 'Kapal Kecil A', allocated: 60000000, used: 30000000 },
            { ship_id: 'KK-002', ship_name: 'Kapal Kecil B', allocated: 60000000, used: 42000000 },
          ]
        },
      }[category.key];
      sidebarContent.innerHTML = `
        <p class="mb-4">Total: <span class="font-semibold">${idr.format(category.amount)}</span></p>
        <h3 class="font-medium mb-2">Per Kapal:</h3>
        <div class="space-y-2">
          ${detailData.sub_items.map(s => `
            <div class="flex items-center justify-between text-sm border-b pb-1">
              <span>${s.ship_name}</span>
              <span>${idr.format(s.used)} / ${idr.format(s.allocated)}</span>
            </div>
          `).join('')}
        </div>
      `;
      detailSidebar.classList.add('open');
    }
  </script>

  <!-- Feather Icons Symbols (used via <use>) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <symbol id="wallet" viewBox="0 0 24 24"><path d="M2 7c0-1.1.9-2 2-2h16a2 2 0 012 2v3h-9a3 3 0 000 6h9v3a2 2 0 01-2 2H4a2 2 0 01-2-2V7z"/></symbol>
    <symbol id="save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V7a2 2 0 012-2h11l5 5v9a2 2 0 01-2 2zM12 17a2 2 0 100-4 2 2 0 000 4z"/></symbol>
    <symbol id="trending-up" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></symbol>
